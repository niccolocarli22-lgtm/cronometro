<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED Pro Challenge</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.6);
            --dark-bg: #050508;
            --panel-bg: #0d0d11;
            
            /* VARIABILI PER SCALARE I NUMERI DEL CRONOMETRO */
            --digit-w: 32px;
            --digit-h: 58px;
            --seg-size: 4px;
        }

        /* Responsive standard per schermi più grandi */
        @media (min-width: 480px) {
            :root {
                --digit-w: 48px;
                --digit-h: 88px;
                --seg-size: 6px;
            }
        }
        @media (min-width: 768px) {
            :root {
                --digit-w: 64px;
                --digit-h: 116px;
                --seg-size: 8px;
            }
        }

        /* --- CONFIGURAZIONE "MODALITÀ GIGANTE" (ATTIVATA DAL FLAG ROSSO) --- */
        body.giant-mode {
            --digit-w: 45px;
            --digit-h: 82px;
            --seg-size: 5px;
        }
        @media (min-width: 480px) {
            body.giant-mode {
                --digit-w: 75px;
                --digit-h: 136px;
                --seg-size: 9px;
            }
        }
        @media (min-width: 768px) {
            body.giant-mode {
                --digit-w: 110px;
                --digit-h: 198px;
                --seg-size: 13px;
            }
        }
        @media (min-width: 1024px) {
            body.giant-mode {
                --digit-w: 130px;
                --digit-h: 236px;
                --seg-size: 16px;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
            touch-action: none; /* Impedisce zoom e gesture di default su iOS */
            transition: background-color 0.3s ease;
        }

        /* --- FLAG VERDE (STORICO) --- */
        .history-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: #111;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            transition: all 0.2s ease;
        }

        /* --- FLAG ROSSO FUOCO (MODALITÀ GIGANTE / SCHERMO INTERO) --- */
        .giant-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #111;
            border: 2px solid #ff3300;
            color: #ff3300;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 51, 0, 0.2);
            transition: all 0.2s;
        }

        .giant-toggle:active, .history-toggle:active {
            transform: scale(0.9);
        }

        body.giant-mode .giant-toggle {
            background: #ff3300;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 51, 0, 0.6);
        }

        /* Nasconde il pulsante start in modalità gigante */
        body.giant-mode .btn-container {
            display: none !important;
        }

        /* Centra perfettamente il cronometro gigante */
        body.giant-mode .display-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- PANNELLO STORICO A SCOMPARSA --- */
        .history-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background-color: var(--panel-bg);
            border-right: 2px solid rgba(0, 255, 102, 0.3);
            z-index: 99;
            transform: translateX(-101%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 80px 20px 20px 20px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .history-panel.open {
            transform: translateX(0);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .history-header h3 {
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
            font-size: 1.1rem;
        }

        .history-item.perfect {
            color: var(--neon-green);
            font-weight: bold;
        }

        /* --- SCHERMO LED FISICO (STILE FOTO) --- */
        .display-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .led-board {
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0) 100%), #000;
            border: 10px solid #1a1a22;
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 
                inset 0 0 40px rgba(0, 0, 0, 1), 
                0 20px 60px rgba(0, 0, 0, 0.9);
            display: inline-block;
            transition: all 0.3s ease;
        }

        .clock-display {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ARCHITETTURA DELLE LIGNETTE DIGITALI ARROTONDATE --- */
        .digit {
            position: relative;
            width: var(--digit-w);
            height: var(--digit-h);
            margin: 0 calc(var(--digit-w) * 0.08);
            display: inline-block;
            transform: skewX(-7deg); /* Inclinazione reale dell'orologio */
        }

        /* Singolo segmento LED (Pasticca/Lignetta Arrotondata) */
        .segment {
            position: absolute;
            background-color: rgba(0, 255, 102, 0.035); /* Segmento spento (visibile sullo sfondo) */
            border-radius: 10px; /* Arrotonda perfettamente le lignette */
            transition: background-color 0.02s ease, box-shadow 0.02s ease;
        }

        /* Accensione segmenti con effetto Neon Glow */
        .digit.show-a .seg-a,
        .digit.show-b .seg-b,
        .digit.show-c .seg-c,
        .digit.show-d .seg-d,
        .digit.show-e .seg-e,
        .digit.show-f .seg-f,
        .digit.show-g .seg-g {
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-glow), 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* Posizionamento geometrico perfetto dei 7 segmenti */
        .seg-a { top: 0; left: calc(var(--seg-size) * 1.2); right: calc(var(--seg-size) * 1.2); height: var(--seg-size); }
        .seg-f { top: calc(var(--seg-size) * 1.2); left: 0; width: var(--seg-size); height: calc(50% - var(--seg-size) * 1.7); }
        .seg-b { top: calc(var(--seg-size) * 1.2); right: 0; width: var(--seg-size); height: calc(50% - var(--seg-size) * 1.7); }
        .seg-g { top: calc(50% - var(--seg-size)/2); left: calc(var(--seg-size) * 1.2); right: calc(var(--seg-size) * 1.2); height: var(--seg-size); }
        .seg-e { top: calc(50% + var(--seg-size) * 0.7); left: 0; width: var(--seg-size); height: calc(50% - var(--seg-size) * 1.7); }
        .seg-c { top: calc(50% + var(--seg-size) * 0.7); right: 0; width: var(--seg-size); height: calc(50% - var(--seg-size) * 1.7); }
        .seg-d { bottom: 0; left: calc(var(--seg-size) * 1.2); right: calc(var(--seg-size) * 1.2); height: var(--seg-size); }

        /* --- PUNTATORI DIVISORI (Punti e Due Punti) --- */
        .separator {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: var(--digit-h);
            width: calc(var(--digit-w) * 0.4);
            margin: 0 calc(var(--digit-w) * 0.05);
            transform: skewX(-7deg);
        }

        .separator .dot {
            width: calc(var(--seg-size) * 1.5);
            height: calc(var(--seg-size) * 1.5);
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-glow), 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .colon { gap: calc(var(--digit-h) * 0.25); }
        .period { justify-content: flex-end; padding-bottom: calc(var(--seg-size) * 0.5); }

        /* --- CONTENITORE PULSANTE --- */
        .btn-container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 30px;
            z-index: 10;
        }

        .action-btn {
            width: 100%;
            height: 140px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(145deg, #00e65c, #00b347);
            color: #000;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.3), inset 0 4px 4px rgba(255,255,255,0.3);
            transition: transform 0.05s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn:active { transform: scale(0.95); }
        .action-btn.stop {
            background: linear-gradient(145deg, #ff3333, #cc0000);
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Flag Verde (Storico a sinistra) -->
    <button id="historyToggle" class="history-toggle" title="Apri storico">⚑</button>

    <!-- Flag Rosso Fuoco (Schermo intero / Gigante a destra) -->
    <button id="giantToggle" class="giant-toggle" title="Modalità Schermo Gigante">⚑</button>

    <!-- Pannello Storico -->
    <div id="historyPanel" class="history-panel">
        <div class="history-header">
            <h3>Storico</h3>
            <button id="clearBtn" class="clear-btn">Azzera</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- Tabellone LED Fisico -->
    <div class="display-container">
        <div class="led-board">
            <div class="clock-display">
                <!-- Minuti -->
                <div class="digit" id="d-m1">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>
                <div class="digit" id="d-m2">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>

                <!-- Due Punti -->
                <div class="separator colon">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <!-- Secondi -->
                <div class="digit" id="d-s1">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>
                <div class="digit" id="d-s2">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>

                <!-- Punto -->
                <div class="separator period">
                    <div class="dot"></div>
                </div>

                <!-- Millesimi -->
                <div class="digit" id="d-ms1">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>
                <div class="digit" id="d-ms2">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>
                <div class="digit" id="d-ms3">
                    <div class="segment seg-a"></div><div class="segment seg-b"></div><div class="segment seg-c"></div><div class="segment seg-d"></div><div class="segment seg-e"></div><div class="segment seg-f"></div><div class="segment seg-g"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pulsante Green (Scompare in modalità Gigante) -->
    <div class="btn-container">
        <button class="action-btn" id="mainBtn">START</button>
    </div>

    <script>
        let isRunning = false;
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        // Mappa dei numeri a 7-segmenti
        const digitMap = {
            '0': ['a', 'b', 'c', 'd', 'e', 'f'],
            '1': ['b', 'c'],
            '2': ['a', 'b', 'g', 'e', 'd'],
            '3': ['a', 'b', 'g', 'c', 'd'],
            '4': ['f', 'g', 'b', 'c'],
            '5': ['a', 'f', 'g', 'c', 'd'],
            '6': ['a', 'f', 'g', 'c', 'd', 'e'],
            '7': ['a', 'b', 'c'],
            '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
            '9': ['a', 'b', 'c', 'd', 'f', 'g']
        };

        const mainBtn = document.getElementById('mainBtn');
        const historyList = document.getElementById('historyList');
        const historyPanel = document.getElementById('historyPanel');
        const historyToggle = document.getElementById('historyToggle');
        const giantToggle = document.getElementById('giantToggle');
        const clearBtn = document.getElementById('clearBtn');

        // Imposta graficamente una cifra LED
        function setDigit(id, char) {
            const digitEl = document.getElementById(id);
            if (!digitEl) return;
            
            // Pulisce lo stato precedente mantenendo la classe digit
            digitEl.className = 'digit';
            
            const activeSegments = digitMap[char] || [];
            activeSegments.forEach(seg => {
                digitEl.classList.add('show-' + seg);
            });
        }

        // Converte i millisecondi e li visualizza sulle cifre fisiche
        function updateDisplay(ms) {
            let minutes = Math.floor(ms / 60000);
            let seconds = Math.floor((ms % 60000) / 1000);
            let milliseconds = Math.floor(ms % 1000);

            let mStr = String(minutes).padStart(2, '0');
            let sStr = String(seconds).padStart(2, '0');
            let msStr = String(milliseconds).padStart(3, '0');

            setDigit('d-m1', mStr[0]);
            setDigit('d-m2', mStr[1]);
            setDigit('d-s1', sStr[0]);
            setDigit('d-s2', sStr[1]);
            setDigit('d-ms1', msStr[0]);
            setDigit('d-ms2', msStr[1]);
            setDigit('d-ms3', msStr[2]);
        }

        function toggleHistory() {
            historyPanel.classList.toggle('open');
        }

        function toggleGiantMode() {
            document.body.classList.toggle('giant-mode');
        }

        // Trigger avvio e spegnimento istantaneo
        function handletrigger() {
            if (!isRunning) {
                isRunning = true;
                startTime = performance.now() - elapsedTime;
                mainBtn.textContent = "STOP";
                mainBtn.classList.add('stop');
                
                function update() {
                    if (!isRunning) return;
                    elapsedTime = performance.now() - startTime;
                    updateDisplay(elapsedTime);
                    timerInterval = requestAnimationFrame(update);
                }
                timerInterval = requestAnimationFrame(update);
            } else {
                isRunning = false;
                cancelAnimationFrame(timerInterval);
                mainBtn.textContent = "START";
                mainBtn.classList.remove('stop');
                
                logTime(elapsedTime);
                elapsedTime = 0; 
            }
        }

        function logTime(ms) {
            const item = document.createElement('div');
            item.className = 'history-item';
            
            let minutes = Math.floor(ms / 60000);
            let seconds = Math.floor((ms % 60000) / 1000);
            let milliseconds = Math.floor(ms % 1000);
            let formatted = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0') + '.' + String(milliseconds).padStart(3, '0');

            const exactMs = Math.floor(ms % 1000);
            if (exactMs === 0) item.classList.add('perfect');

            item.innerHTML = `<span>Prova ${historyList.children.length + 1}</span> <span>${formatted}</span>`;
            historyList.insertBefore(item, historyList.firstChild);
        }

        // --- GESTIONE EVENTI (INTERCETTAZIONE WIRELESS) ---

        // Listener dedicati sui due Flag per bloccare la propagazione al cronometro
        historyToggle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            toggleHistory();
        });

        giantToggle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            toggleGiantMode();
        });

        clearBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            historyList.innerHTML = '';
        });

        // Intercettazione globale per avviare/fermare il tempo (ovunque si clicchi o si prema un tasto)
        window.addEventListener('pointerdown', (e) => {
            // Evita di far scattare il tempo se interagiamo con i menu
            if (e.target.closest('#historyPanel')) return;
            if (historyPanel.classList.contains('open')) {
                historyPanel.classList.remove('open');
                return;
            }
            
            e.preventDefault();
            handletrigger();
        });

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (historyPanel.classList.contains('open')) return;
            handletrigger();
        });

        // Inizializza il display a 00:00.000 all'avvio
        updateDisplay(0);
    </script>
</body>
</html>
